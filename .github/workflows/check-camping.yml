name: Monitor Camping Alba

# GitHub Actions usa SIEMPRE hora UTC. En horario de verano España = UTC+2,
# así que las horas de abajo son: 7,10,13,16,19 UTC -> 9,12,15,18,21 hora española.
# (En invierno, al ser el cron fijo en UTC, se corren a 8,11,14,17,20.)
#
# OJO con los minutos: GitHub retrasa o DESCARTA los cron en los momentos de
# alta carga, que coinciden con el inicio de cada hora (minuto :00) y, en menor
# medida, la media hora. Por eso NO usamos minuto 0/30, sino minutos
# "raros" (5,35 y 15) para reducir el riesgo de que se salte la ejecución.
on:
  schedule:
    - cron: '5,35 * * * *'            # chequeo de disponibilidad cada 30 min
    - cron: '15 7,10,13,16,19 * * *'  # heartbeat "sigo vivo" 5 veces/día
  workflow_dispatch: {}              # permite lanzarlo a mano desde la pestaña Actions

# Si llegan dos disparos solapados, deja correr el más reciente.
concurrency:
  group: camping-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Chequear disponibilidad
        # HEARTBEAT (mensaje "sigo vivo" con el resultado) se activa cuando:
        #  - dispara el cron del heartbeat, o
        #  - la variable de repositorio HEARTBEAT_SIEMPRE vale "1" (útil al
        #    principio para confirmar en CADA ejecución que Telegram y el
        #    chequeo funcionan; bórrala o ponla a "0" cuando ya no la quieras).
        # Se configura en: Settings -> Secrets and variables -> Actions ->
        # pestaña "Variables" -> New repository variable.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEARTBEAT: ${{ (github.event.schedule == '15 7,10,13,16,19 * * *' || vars.HEARTBEAT_SIEMPRE == '1') && '1' || '' }}
        # El script sale con 1 cuando todo está COMPLETO (no es un fallo del
        # workflow), así que no marcamos la ejecución como fallida por ello.
        run: node check-camping.js || [ $? -eq 1 ]
